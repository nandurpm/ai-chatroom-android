name: Android debug build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK and summarize tests
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -5
          python3 scripts/summarize_tests.py
          cp app/build/outputs/apk/debug/app-debug.apk AI-Chatroom-NVIDIA.apk
          sha256sum AI-Chatroom-NVIDIA.apk > SHA256SUMS.txt
          tar -czf test-results.tar.gz -C app/build/reports/tests testDebugUnitTest
      - name: Attach APK to private repository release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: debug-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" AI-Chatroom-NVIDIA.apk SHA256SUMS.txt test-results.tar.gz \
            --target "$GITHUB_SHA" --prerelease --title "AI Chatroom Quick replies v1.2 - build $GITHUB_RUN_NUMBER" \
            --notes "Debug APK built from $GITHUB_SHA. Unit tests and APK signature verification passed. Quick replies enabled by default: reduced thinking, shorter answers, Stop button, and 90-second per-provider deadline. NVIDIA Nemotron with Qwen fallback and Gemini 3.6 Flash. OpenAI credits not required. Enter NVIDIA and Gemini API keys in Settings."
